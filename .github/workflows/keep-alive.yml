name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * *'   # UTC 12:00 = Bangladesh 18:00 daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent free-tier pause
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/clients?select=client_code&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Supabase not responding! Status: $STATUS"
            exit 1
          fi
          echo "Supabase is alive"
